services:
  users:
    build:
      context: .
      dockerfile: services/users/Dockerfile
    container_name: bolotext_users
    env_file:
      - services/users/.env
    environment:
      # Compose's `environment:` overrides `env_file:`, so this always wins
      # even if the local .env (also used for `uv run` dev) says otherwise —
      # this stack is never allowed to run with --reload.
      ENVIRONMENT: production
      WORKERS: ${WORKERS:-4}
    networks:
      - bolotext-network
    restart: always

  api-gateway:
    build:
      context: .
      dockerfile: services/api-gateway/Dockerfile
    container_name: bolotext_api_gateway
    ports:
      - 8000:8000
    env_file:
      - services/api-gateway/.env
    environment:
      USERS_SERVICE_URL: http://users:8001
      AGENTS_SERVICE_URL: http://agents:8002
      ENVIRONMENT: production
      WORKERS: ${WORKERS:-4}
    depends_on:
      - users
      - agents
    networks:
      - bolotext-network
    restart: always

  agents:
    build:
      context: .
      dockerfile: services/agents/Dockerfile
    container_name: bolotext_agents
    env_file:
      - services/agents/.env
    environment:
      USERS_SERVICE_URL: http://users:8001
      ENVIRONMENT: production
      WORKERS: ${WORKERS:-4}
    depends_on:
      - users
    networks:
      - bolotext-network
    restart: always

networks:
  bolotext-network:
    driver: bridge
