services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bolotext_backend
    ports:
      - 7860:7860
    env_file:
      - .env
    environment:
      # Compose's `environment:` overrides `env_file:`, so this stack never
      # runs with --reload even if the local .env says development.
      ENVIRONMENT: production
      WORKERS: ${WORKERS:-1}
    restart: always
