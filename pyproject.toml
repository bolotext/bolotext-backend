[project]
name = "bolotext-backend"
version = "0.1.0"
description = "Voice AI platform backend: Users (identity, organizations, RBAC) and Agents (agent builder, providers, WhatsApp, call logs) as one service."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.34.0",
    "motor>=3.6.0",
    "beanie>=1.29.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.7.0",
    "pyjwt>=2.10.0",
    "colorlog>=6.9.0",
    "httpx>=0.28.0",
    "cryptography>=43.0.0",
    "email-validator>=2.2.0",
    "slowapi>=0.1.9",
    "google-auth>=2.35.0",
    "requests>=2.32.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "mongomock-motor>=0.0.35",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
